appId: com.seven.ai
---
# Smoke test: the app boots to the dashboard, the HUD exposes the active-brain
# readout, the module deck renders, and the chat screen opens.
#
# Text assertions are bilingual. A clean CI install enters onboarding, so the
# flow explicitly takes the honest local-engine quick path when it is visible.
- launchApp:
    clearState: true
- runFlow:
    when:
      visible: "TRY IT NOW — SKIP SETUP|ESSAYER MAINTENANT — PASSER LA CONFIG"
    commands:
      - tapOn: "TRY IT NOW — SKIP SETUP|ESSAYER MAINTENANT — PASSER LA CONFIG"
- assertVisible: "SYSTEMS NOMINAL|SYSTÈMES NOMINAUX"

# Which brain answers is permanently visible in the HUD (Gemini / OpenRouter /
# local, with latency and token cost once a turn has completed).
- assertVisible: "Active brain:.*|Cerveau actif.*"

- scrollUntilVisible:
    element:
      text: "MODULES"
    direction: DOWN

# Open the chat screen
- tapOn: "CHAT"
- assertVisible: "SEVEN CHAT TERMINAL|SEVEN CHAT \\[DEMO MIC\\]"

# Navigate back to the dashboard
- back
- assertVisible: "SYSTEMS NOMINAL|SYSTÈMES NOMINAUX"
